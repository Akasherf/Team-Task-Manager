spring.application.name=demo

# MySQL DataSource Properties (Uses environment variables in production, fallback to local)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/taskdb}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:your_password}

# Hibernate / JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port (Railway provides the PORT automatically)
server.port=${PORT:8084}
